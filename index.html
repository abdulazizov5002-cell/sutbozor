<head>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f7f8;--card:#fff;--ink:#14212b;--mut:#61717c;--line:#d9e3e8;--acc:#2a7a52;--accbg:#dff1e7;--warn:#8a5a00;--warnbg:#fbeecb;--bad:#a13a2c;--badbg:#f8e0dc;--milk:#2f7fa6;--gold:#d99a12;--s1:#2a7a52;--s2:#3b82a6;--s3:#c9892b;--s4:#8a5fb0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--card:#172830;--ink:#eaf2f5;--mut:#93a6b0;--line:#2b414b;--acc:#63c793;--accbg:#173a2a;--warn:#f0c15f;--warnbg:#3a2e12;--bad:#f0907f;--badbg:#3d2320;--milk:#5aa8d0;--gold:#f0b840;--s1:#3f9d70;--s2:#4f9cc4;--s3:#d79a3c;--s4:#a67cc8}}
:root[data-theme="dark"]{--bg:#0f1a20;--card:#172830;--ink:#eaf2f5;--mut:#93a6b0;--line:#2b414b;--acc:#63c793;--accbg:#173a2a;--warn:#f0c15f;--warnbg:#3a2e12;--bad:#f0907f;--badbg:#3d2320;--milk:#5aa8d0;--gold:#f0b840;--s1:#3f9d70;--s2:#4f9cc4;--s3:#d79a3c;--s4:#a67cc8}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:800px;margin:0 auto;padding:14px 14px 40px}
h1,h2,h3,.big{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:24px}h2{font-size:19px;margin-bottom:10px}
.hint{color:var(--mut);font-size:14px;margin:4px 0 0}
.hd{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.seg{display:flex;gap:4px}
.seg button,.nav button{padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"],.nav button[aria-current="page"]{background:var(--acc);border-color:var(--acc);color:#fff}
.nav{display:flex;gap:6px;margin:12px 0}.nav button{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
:focus-visible{outline:3px solid var(--milk);outline-offset:2px}
.big{font-size:34px;line-height:1.1}.big.p{color:var(--warn)}
.meter{display:flex;height:30px;border-radius:9px;overflow:hidden;margin:10px 0 6px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px)}
.meter i{display:flex;align-items:center;justify-content:center;color:#fff;font:600 12px system-ui;font-style:normal;white-space:nowrap;overflow:hidden}
.tag{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--accbg);color:var(--acc);white-space:nowrap;font-weight:600}
.tag.x{background:var(--badbg);color:var(--bad)}.tag.w{background:var(--warnbg);color:var(--warn)}.tag.n{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.row.f{border-top:0}.row b{display:block}.row small{color:var(--mut)}
.btn{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}.btn.d{color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>div{border-radius:12px;padding:10px}
.now{background:var(--accbg)}.cap{background:var(--bg);border:1px solid var(--line)}
.dl{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;font-size:14px}
.sr{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:6px 0}
.star{border:0;background:none;color:var(--line);font-size:28px;line-height:1;padding:2px 3px;cursor:pointer}.star.on{color:var(--gold)}
.msg{color:var(--bad);font-size:14px;margin:8px 0 0}
details summary{cursor:pointer;color:var(--mut);font-size:14px;margin-top:8px}
.lg{list-style:none;margin:6px 0 0;padding:0;font-size:13px;color:var(--mut)}
@media (max-width:480px){.two{grid-template-columns:1fr}}
#adm{max-width:1100px;margin:0 auto;padding:14px}
.an{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:6px}
.an button{flex:none;padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.an button[aria-current="page"]{background:var(--acc);border-color:var(--acc);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat small{display:block;color:var(--mut);font-size:13px}.stat b{font:700 24px Georgia,serif}.stat span{display:block;color:var(--mut);font-size:13px}
.tw{overflow-x:auto}.tw table{width:100%;border-collapse:collapse;font-size:13px}.tw th,.tw td{padding:8px;border-top:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}.tw th{color:var(--mut);font-weight:600;border-top:0}
.br{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;font-size:14px;margin:6px 0}.br div{background:var(--line);border-radius:6px;overflow:hidden}.br i{display:block;height:10px;background:var(--milk)}
pre.sc{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace;overflow-x:auto;margin:0}
.nav{overflow-x:auto}.nav button{white-space:nowrap}
#adm{--bg:#eef0f7;--card:#fff;--ink:#14212b;--mut:#5a6275;--line:#d5d9e8;--acc:#3b4ea8;--accbg:#e3e7fb;--warn:#8a5a00;--warnbg:#fbeecb;--bad:#a13a2c;--badbg:#f8e0dc;--milk:#3b4ea8;background:var(--bg);color:var(--ink);max-width:none;margin:0;padding:0;min-height:100vh}
.aw{max-width:1280px;margin:0 auto;padding:14px}
.ab{background:#1d2440;color:#fff;border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}.ab h1{color:#fff}.ab .hint{color:#b9c0dc}
.al .an{margin:12px 0}
@media (min-width:900px){.al{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}.al .an{flex-direction:column;overflow:visible;position:sticky;top:10px}.al .an button{text-align:left}}
.btn.s{padding:3px 8px;font-size:13px;margin:2px 2px 2px 0}
</style>

<main>
<div class="hd"><div><h1>🥛 SutBozor</h1><p class="hint">Uy xo'jaliklari va mahalliy bizneslarni bog'lovchi platforma</p></div>
<div class="seg" id="roles"><button data-role="business">Biznes</button><button data-role="supplier">Supplier</button></div></div>

<!-- Telegram Mini App kutubxonasi (initData beradi). Telegramdan tashqarida ham sahifa avvalgidek ishlaydi. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Backend integratsiya qatlami (env.js da useBackend=false bo'lsa ishlatilmaydi). Fayllar topilmasa sahifa avvalgidek ishlaydi. -->
<script src="env.js"></script>
<script src="js/config.js"></script>
<script src="js/api/apiClient.js"></script>
<script src="js/api/authService.js"></script>
<script src="js/api/productService.js"></script>
<script src="js/api/supplierService.js"></script>
<script src="js/api/orderService.js"></script>
<script src="js/api/contractService.js"></script>
<script src="js/api/paymentService.js"></script>
<script src="js/api/disputeService.js"></script>
<script src="js/api/index.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ");
const nm=n=>n.toFixed(1).replace(".",",").replace(/,0$/,"");
const pad=n=>String(n).padStart(2,"0");
const tmin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
const hm=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const nowT=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const CAT={Sut:"L",Qatiq:"L",Qaymoq:"L",Suzma:"kg",Tvorog:"kg","Sariyog'":"kg"};
const AREAS={"Ziyokor":[5,5],"Oqtepa":[6.2,5],"Bog'ishamol":[5,7.4],"Yangiobod":[0.9,5],"Guliston":[2,3.5],"Do'stlik":[8,2],"Qorasuv":[9,8.2],"Navbahor":[11,5]};
const dist=(a,b)=>Math.hypot(AREAS[a][0]-AREAS[b][0],AREAS[a][1]-AREAS[b][1]);
const COL=["var(--s1)","var(--s2)","var(--s3)","var(--s4)"];
const CR={toSup:[["Mahsulot sifati",30],["Tozalik/gigiyena",25],["Vaqtida yetkazish",20],["Miqdor aniqligi",15],["Muloqot",10]],toBiz:[["To'lov intizomi",40],["Buyurtma aniqligi",25],["Muloqot",15],["Buyurtmani qabul qilish",20]]};
const PS=(n,t,c,p)=>({name:n,today:t,cap:c,price:p});
const SUP0=[
{id:"A",name:"Ergashevlar xo'jaligi",area:"Oqtepa",radius:3,rating:4.8,n:37,products:[PS("Sut",8,12,13500),PS("Qatiq",5,6,16000)]},
{id:"B",name:"Karimovlar xo'jaligi",area:"Bog'ishamol",radius:5,rating:4.6,n:21,products:[PS("Sut",7,10,14000),PS("Tvorog",3,4,45000)]},
{id:"C",name:"Qodirovlar xo'jaligi",area:"Yangiobod",radius:5,rating:4.9,n:12,products:[PS("Sut",5,8,14500),PS("Sariyog'",2,3,95000)]},
{id:"D",name:"Rahimovlar xo'jaligi",area:"Guliston",radius:2,rating:4.2,n:8,products:[PS("Sut",6,6,12500)]},
{id:"E",name:"Toshmatovlar xo'jaligi",area:"Qorasuv",radius:6,rating:4.5,n:15,products:[PS("Sut",10,15,13000)]},
{id:"F",name:"Yusupovlar xo'jaligi",area:"Do'stlik",radius:5,rating:3.9,n:5,products:[PS("Sut",4,5,16500)]},
{id:"G",name:"Nazarovlar xo'jaligi",area:"Navbahor",radius:8,rating:4.7,n:26,products:[PS("Sut",9,10,12000)]}];
/* ===== 1-BOSQICH: konfiguratsiya, rollar, audit, to'lovlar (backendga ko'chirishga tayyor tuzilma) ===== */
const CONFIG={platformCommission:0,currency:"so'm",paymentPeriodDays:7,paymentProvider:"manual",deliveryGapMin:{supplier:40,pickup:20},timezone:"Asia/Tashkent",confirmDays:3}; // komissiya 0%: supplier to'liq summani oladi
const ROLES=["business","supplier","admin"]; // admin oddiy interfeysda ko'rinmaydi, faqat alohida #admin kirish orqali
/* Admin kirishi faqat server orqali (Telegram -> /api/auth/me, rol bazadan). Frontendda admin login/parol yo'q (pastda ADM, admVerify). */
const dm=s=>s.split("-").reverse().join(".");
const dt=s=>{const d=new Date(s);return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())};
/* audit_log yozuvi: {id,ts,actor,role,action,type,oid,desc} */
const mkA=(s,ts,actor,role,action,type,oid,desc)=>{s.nextAud=s.nextAud||1;s.audit.push({id:"AUD-"+s.nextAud++,ts,actor,role,action,type,oid,desc});if(s.audit.length>500)s.audit.shift()};
const audit=(actor,role,action,type,oid,desc)=>mkA(S,new Date().toISOString(),actor,role,action,type,oid,desc);
/* ===== 2-BOSQICH: Payment va Contract arxitekturasi. SutBozor pul ushlamaydi, komissiya olmaydi: faqat to'lovni hisoblaydi va qayd qiladi (Business → Supplier) ===== */
const PAYL={DELIVERY:"Yetkazilganda to'lash",WEEKLY:"Haftalik to'lov",MONTHLY:"Oylik to'lov",PREPAID:"Oldindan to'lov"};
const PT={PENDING:["Kutilmoqda","w"],PAYMENT_SUBMITTED:["Tasdiqlash kutilmoqda","w"],PAID:["To'langan",""],OVERDUE:["Kechikkan","x"],CANCELLED:["Bekor qilingan","n"],DISPUTED:["Nizoli","x"]};
const CST={DRAFT:["Qoralama","n"],PENDING:["Kutilmoqda","w"],ACTIVE:["Faol",""],PAUSED:["To'xtatilgan","w"],COMPLETED:["Yakunlangan",""],CANCELLED:["Bekor qilingan","x"]};
const ctag=st=>`<span class="tag ${CST[st][1]}">${CST[st][0]}</span>`;
const payState=x=>x.status;
/* Sanalar brauzer zonasiga emas, biznes zonasiga (CONFIG.timezone) qarab olinadi: OVERDUE va "muddat yaqin" mahalliy yarim tunda almashadi */
const today=()=>{try{return new Intl.DateTimeFormat("en-CA",{timeZone:CONFIG.timezone,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}catch(e){return new Date(Date.now()+5*36e5).toISOString().slice(0,10)}};
const addD=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
const fee=a=>Math.round(a*CONFIG.platformCommission/100); // platformCommission=0, shuning uchun grossAmount = supplierAmount
/* Provider interfeysi: {name, methods[], initiate(payment)->{ref,redirectUrl}, verify(payment,data)->{ok,transactionId}}.
   Click/Payme/Uzum keyinchalik shu interfeys bilan ulanadi va CONFIG.paymentProvider almashtiriladi. UI va PaymentService o'zgarmaydi. */
const stub=n=>({name:n,methods:[n],initiate(){throw Error(n+" hali ulanmagan")},verify(){throw Error(n+" hali ulanmagan")}});
const PaymentProviders={manual:{name:"Qo'lda kiritish (gateway yo'q)",methods:["Naqd","Bank o'tkazmasi","Karta → karta"],initiate:()=>({ref:null}),verify:(p,d)=>({ok:true,transactionId:d.tx})},click:stub("Click"),payme:stub("Payme"),uzum:stub("Uzum")};
const PaymentService={
get provider(){return PaymentProviders[CONFIG.paymentProvider]},
/* davrga bo'lish: oxirgi davr qoldiqni oladi (30 kun haftalik: 1-7, 8-14, 15-21, 22-30) */
buildSchedule(days,daily,pay){
  if(pay==="DELIVERY")return[{seq:1,fromDay:1,toDay:1,days:1,amount:daily}];
  if(pay==="PREPAID")return[{seq:1,fromDay:1,toDay:days,days,amount:daily*days}];
  const size=pay==="MONTHLY"?30:7,n=Math.max(1,Math.floor(days/size)),r=[];
  for(let k=0;k<n;k++){const f=k*size+1,t=k===n-1?days:(k+1)*size;r.push({seq:k+1,fromDay:f,toDay:t,days:t-f+1,amount:(t-f+1)*daily})}
  return r},
contract(s,o,p,start,st){const c={id:"CT-"+s.nextCt++,orderId:o.id,businessId:o.businessId||"BZ-1",supplierId:p.sup,product:o.product,quantityPerDay:p.qty,unit:CAT[o.product],pricePerUnit:p.price,days:o.days,startDate:start,endDate:addD(start,o.days-1),paymentSchedule:o.pay,deliveryMode:o.mode,status:st,createdAt:o.created,activated:["ACTIVE","PAUSED","COMPLETED"].includes(st)};
  s.contracts.push(c);p.contractId=c.id;mkA(s,o.created,"Tizim","system","contract.create","contract",c.id,o.id+" / Supplier "+p.sup+": shartnoma yaratildi");return c},
make(s,o,p,c,z,due,paid){const tot=p.qty*p.price*o.days;if(!(z.amount>=0)||z.amount>tot+.5||s.pay.filter(y=>y.contractId===c.id).reduce((a,y)=>a+y.amount,0)+z.amount>tot+.5)throw Error("To'lov summasi buyurtma summasidan oshib ketdi.");const now=new Date().toISOString(),f=fee(z.amount),x={id:"PAY-"+s.nextPay++,orderId:o.id,contractId:c.id,businessId:o.businessId||"BZ-1",supplierId:p.sup,amount:z.amount,currency:CONFIG.currency,paymentPeriod:o.pay,dueDate:due,paidAt:paid?due:null,paymentMethod:paid?"Bank o'tkazmasi":null,transactionId:paid?"TX-"+s.nextPay:null,status:paid?"PAID":"PENDING",note:"",createdAt:now,updatedAt:now,
  seq:z.seq,label:z.fromDay===z.toDay?z.fromDay+"-kun":z.fromDay+"–"+z.toDay+" kun",fromDay:z.fromDay,toDay:z.toDay,days:z.days,platformCommission:f,grossAmount:z.amount,supplierAmount:z.amount-f};
  s.pay.push(x);return x},
schedule(s,o,p,c,start,paidN){if(o.pay==="DELIVERY")return;const sch=this.buildSchedule(o.days,p.qty*p.price,o.pay);
  sch.forEach(z=>this.make(s,o,p,c,z,o.pay==="PREPAID"?start:addD(start,z.toDay),z.seq<=paidN));
  mkA(s,new Date().toISOString(),"Tizim","system","payment.schedule","contract",c.id,PAYL[o.pay]+": "+sch.length+" ta to'lov yaratildi")},
onDelivered(s,o,p,day){if(o.pay!=="DELIVERY")return;const c=s.contracts.find(x=>x.id===p.contractId);if(!c)return;
  const x=this.make(s,o,p,c,{seq:day,fromDay:day,toDay:day,days:1,amount:p.qty*p.price},today(),false);mkA(s,x.createdAt,"Tizim","system","payment.created","payment",x.id,o.id+": "+day+"-kun yetkazildi, to'lov yaratildi")},
note(x,t){const o=S.orders.find(y=>y.id===x.orderId);if(o){o.log.push(nowT()+" "+t);o.updated=new Date().toISOString()}},
/* shartnoma holatini sinxronlash, jadval yaratish, bekor qilish va avtomatik OVERDUE */
sync(){const now=today(),ts=new Date().toISOString();
  S.orders.forEach(o=>o.parts.forEach(p=>{const c=S.contracts.find(x=>x.id===p.contractId);if(!c)return;const st=p.st==="SENT"?"PENDING":p.st;if(c.status===st)return;
    c.status=st;audit("Tizim","system","contract.status","contract",c.id,"Holat: "+CST[st][0]);
    if(st==="ACTIVE"&&!c.activated){c.activated=true;c.startDate=now;c.endDate=addD(now,o.days-1);this.schedule(S,o,p,c,now,0)}
    if(st==="CANCELLED")S.pay.forEach(x=>{if(x.contractId===c.id&&(x.status==="PENDING"||x.status==="OVERDUE")){x.status="CANCELLED";x.updatedAt=ts;audit("Tizim","system","payment.cancelled","payment",x.id,"Shartnoma bekor qilindi")}else if(x.contractId===c.id&&x.status==="PAYMENT_SUBMITTED"&&!x.cancelNote){x.cancelNote=true;x.note=((x.note?x.note+" ":"")+"Shartnoma bekor qilindi: to'lovni tasdiqlang yoki nizo oching.").slice(0,300);x.updatedAt=ts;[Notify.sup(x.supplierId),Notify.biz(x.businessId)].forEach(t=>Notify.send(t,"contract.cancelled","Bekor qilingan shartnoma to'lovi",x.id+": yuborilgan to'lov hal qilinishi kerak (tasdiqlash yoki nizo)"))}})}));
  S.pay.forEach(x=>{
    if(x.status==="PENDING"&&x.dueDate<now){x.status="OVERDUE";x.updatedAt=ts;audit("Tizim","system","payment.overdue","payment",x.id,x.orderId+": muddat o'tdi ("+dm(x.dueDate)+")");[Notify.biz(x.businessId),Notify.sup(x.supplierId)].forEach(t=>Notify.send(t,"payment.overdue","To'lov kechikdi",x.orderId+" #"+x.seq+": "+fmt(x.amount)+" so'm"))}
    else if(x.status==="PENDING"&&!x.soon&&x.dueDate<=addD(now,2)){x.soon=true;Notify.send(Notify.biz(x.businessId),"payment.due","To'lov muddati yaqin",x.orderId+" #"+x.seq+": "+fmt(x.amount)+" so'm, muddat "+dm(x.dueDate))}

function eff(kind,id){

  S.orders.forEach(o=>o.parts.forEach(p=>{if(p.r.toSup&&p.r.toBiz&&(kind==="toBiz"||p.sup===id)){sum+=score(p.r[kind],kind);c++}}));

function search(q){
  const inc=[],exc=[];
  for(const s of S.sups){
    const pr=s.products.find(p=>p.name===q.product),d=dist(S.biz.area,s.area),rt=eff("toSup",s.id).v;let why=null;
    if(!supActive(s.id))why="Supplier faol emas";
    else if(!pr||pr.cap<=0)why="Mahsulot yoki quvvat yo'q";
    else if(d>q.radius+1e-9)why="Radiusdan uzoq ("+nm(d)+" km)";
    else if(d>s.radius+1e-9)why="Yetkazish hududidan tashqarida ("+s.radius+" km)";
    else if(pr.price>q.maxPrice)why="Narx yuqori";
    else if(rt<q.minRating)why="Reyting past";
    const r={s,pr,d,rt};why?exc.push({...r,why}):inc.push(r);
  }
  const sc=r=>.4*(1-r.d/q.radius)+.3*Math.max(0,(q.maxPrice-r.pr.price)/q.maxPrice)+.3*(r.rt/5);
  const cmp={dist:(a,b)=>a.d-b.d,price:(a,b)=>a.pr.price-b.pr.price,rating:(a,b)=>b.rt-a.rt,score:(a,b)=>sc(b)-sc(a)}[q.sort];
  inc.sort(cmp);let rem=q.qty;
  for(const r of inc){r.take=Math.min(r.pr.cap,Math.max(rem,0));rem=Math.round((rem-r.take)*100)/100}
  const cov=q.qty-Math.max(rem,0);
  return{inc,exc,cov,short:Math.max(rem,0),pct:q.qty>0?Math.floor(cov/q.qty*100):0};
}

function run(a,ds){ // barcha harakatlar shu yerdan o'tadi: permission → validatsiya → holat o'zgarishi. Backendda shu qatlam API endpoint bo'ladi

      S.orders[0].parts.forEach(pp=>{PaymentService.contract(S,S.orders[0],pp,today(),"PENDING");Notify.send(Notify.sup(pp.sup),"order.new","Yangi buyurtma",S.orders[0].id+": "+nm(pp.qty)+" "+unit(S.orders[0])+"/kun")});log(S.orders[0],"Biznes","Buyurtma yaratildi va "+used.length+" ta supplierga yuborildi");S.tab.business="orders"}
  }else if(a==="cancelo"&&R==="business"){o.parts.forEach(x=>{if(x.st!=="COMPLETED")x.st="CANCELLED"});log(o,"Biznes","Buyurtmani bekor qildi")}
  else if(a==="pickup"&&R==="business"&&p.dl==="READY"&&o.mode==="pickup"){p.dl="DELIVERED";log(o,"Biznes","Supplier "+p.sup+": olib ketdi");advance(o,p)}
  else if(R==="supplier"&&p&&p.sup===cu.supplierId){
    if(a==="accept"&&p.st==="SENT"){p.st="ACTIVE";log(o,"Supplier "+p.sup,"Qismni qabul qildi")}
    else if(a==="reject"&&p.st==="SENT"){p.st="CANCELLED";log(o,"Supplier "+p.sup,"Qismni rad etdi")}
    else if(NXT[a]&&p.st==="ACTIVE"){p.dl=NXT[a];log(o,"Supplier "+p.sup,DST[p.dl])}
    else if(a==="done"&&p.dl==="IN_TRANSIT"){p.dl="DELIVERED";log(o,"Supplier "+p.sup,"Yetkazdi");advance(o,p)}

  }else if(a==="reset")throw Error("Demo ma'lumotni faqat admin tiklay oladi (Admin → Sozlamalar).")
  if(p&&R==="supplier"){const nb=Notify.biz(o.businessId),t=o.id+" / Supplier "+p.sup;

  }catch(err){BN=err.message}
  save();render();
}

    else if(canPay)acts=`<div class="acts"><button class="btn s p" data-pa="open" data-id="${p.id}"${busy?" disabled":""}>${p.status==="DISPUTED"?"Qayta yuborish":"To'lov qildim"}</button></div>`;
    else if(canJudge)acts=`<div class="acts"><button class="btn s p" data-pa="confirm" data-id="${p.id}"${busy?" disabled":""}>Pul keldi</button><button class="btn s d" data-pa="ask" data-id="${p.id}">Pul kelmadi</button></div>`;
    return `<div class="row f" style="padding:6px 0"><div><b>${esc(p.publicId)} · ${money(p.amount)} so'm</b><small>${p.days>0?esc(p.fromDay)+"–"+esc(p.toDay)+"-kunlar ("+esc(p.days)+" kun) · ":""}muddat: ${esc(p.dueDate)}${sn}</small>${info}</div><span class="tag ${st[1]}">${esc(st[0])}</span></div>${acts}`};
  const draw=()=>{const act=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.pr;
    box.innerHTML=`<div class="card"><h2>${biz?"To'lovlarim (server)":"Kelgan to'lovlar (server)"}</h2><p class="hint">SutBozor pul ushlab turmaydi va komissiya olmaydi (0%). Biznes supplierga o'zi to'laydi, bu yerda faqat yozib boriladi.</p><p class="msg" role="alert">${esc(msg)}</p>${ok?`<p class="hint" style="color:var(--acc)">${esc(ok)}</p>`:""}${list.map(row).join("")||`<p class="hint">Hozircha to'lov yo'q. Supplier buyurtmani qabul qilgach shu yerda paydo bo'ladi.</p>`}<div class="acts"><button class="btn s" data-pa="reload"${busy?" disabled":""}>Yangilash</button></div></div>`;
    if(act){const el=box.querySelector("[data-pr]");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}};
  const loadList=()=>api.payments.list({page:1,limit:100}).then(r=>{list=(r&&r.items)||[]});
  const load=()=>{busy=true;draw();return call(()=>Promise.all([loadList(),biz?api.suppliers.list({page:1,limit:100}).then(r=>{sups={};((r&&r.items)||[]).forEach(s=>sups[s.id]=s)}).catch(()=>{}):null])).then(()=>{busy=false;draw()}).catch(fail)};
  const run=(f,done)=>{busy=true;msg="";ok="";draw();call(f).then(()=>{ok=done;FM.key="";RJ.key="";return loadList()}).then(()=>{busy=false;draw()}).catch(e=>{loadList().catch(()=>{}).then(()=>fail(e))})};
  const submit=id=>{const tx=FM.tx.trim();
    if(tx.length<3){msg="Tranzaksiya raqamini yozing (kamida 3 belgi).";draw();return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(FM.paidOn)||FM.paidOn>TODAY){msg="To'langan sana kelajakda bo'lishi mumkin emas.";draw();return}
    run(()=>api.payments.submit(id,{method:FM.method,transactionId:tx,paidOn:FM.paidOn,note:FM.note.trim()}),"To'lov yozildi. Supplier pul kelganini tasdiqlashi kutilmoqda.")};
  box.addEventListener("input",e=>{const d=e.target&&e.target.dataset;if(!d)return;if(d.pf)FM[d.pf]=e.target.value;else if(d.pr)RJ.reason=e.target.value});
  box.addEventListener("click",e=>{if(busy)return;const b=e.target.closest("[data-pa]");if(!b)return;const a=b.dataset.pa,id=b.dataset.id;
    if(a==="reload")load();else if(a==="close"){FM.key="";RJ.key="";draw()}
    else if(a==="open"){FM.key=id;FM.method=METHODS[0];FM.tx="";FM.paidOn=TODAY;FM.note="";RJ.key="";msg="";draw()}
    else if(a==="ask"){RJ.key=id;RJ.reason="";FM.key="";msg="";draw()}
    else if(a==="submit")submit(id);
    else if(a==="confirm")run(()=>api.payments.confirm(id),"Pul kelgani tasdiqlandi.");
    else if(a==="reject"){const r=RJ.reason.trim();if(r.length<3){msg="Sababni yozing (kamida 3 belgi).";draw();return}run(()=>api.payments.reject(id,r),"Pul kelmagani yozildi. Xaridor qayta yuborishi mumkin.")}});
  load()}
/* Serverdagi nizolar (POST /api/disputes, POST /api/disputes/:id). Biznes/supplier o'z to'lovi yoki buyurtmasi bo'yicha nizo ochadi, admin
   ko'rib chiqadi va hal qiladi. Nizo pul harakati qilmaydi va to'lov holatini o'zgartirmaydi: SutBozor pul ushlab turmaydi, faqat qaror yoziladi.
   Admin ko'rinishi (role "admin") faqat server tasdiqlagan ADMIN uchun #adis da ochiladi. Demo bo'limlar (localStorage) ta'sirlanmaydi. */
function srvDisputes(api,role,box){
  const adm=role==="admin",biz=role==="business",RS={NOT_DELIVERED:"Yetkazilmadi",WRONG_QTY:"Miqdor noto'g'ri",QUALITY:"Sifat muammosi",PAYMENT:"To'lov masalasi",LATE:"Kechikdi",PRICE:"Narx",OTHER:"Boshqa"},
    ST={OPEN:["Ochiq","w"],UNDER_REVIEW:["Ko'rib chiqilmoqda","w"],RESOLVED:["Hal qilindi",""],REJECTED:["Rad etildi","x"],CLOSED:["Yopildi","n"]};
  const FM={open:false,target:"",reason:"PAYMENT",desc:""},AX={id:"",status:"",text:""};
  let list=[],targets=[],msg="",ok="",busy=false;
  const call=f=>(api.auth.isAuthenticated()?Promise.resolve():api.auth.loginWithTelegram()).then(f).catch(e=>{if(e&&e.status===401)return api.auth.loginWithTelegram().then(f);throw e});
  const fail=e=>{busy=false;ok="";msg=e&&e.message?e.message:"Xato yuz berdi.";draw()};
  const money=n=>Number(n).toLocaleString("ru-RU").replace(/ /g," ");
  const row=d=>{const st=ST[d.status]||[d.status,"n"],asking=AX.id===d.id,by=d.openedBy==="business"?"Biznes":"Supplier";
    const GO=(s,label,cls)=>`<button class="btn s ${cls||"p"}" data-da="now" data-id="${d.id}" data-st="${s}"${busy?" disabled":""}>${label}</button>`,ASK=(s,label,cls)=>`<button class="btn s ${cls||"p"}" data-da="ask" data-id="${d.id}" data-st="${s}">${label}</button>`;
    let acts="";
    if(adm){if(asking)acts=`<div class="acts"><input type="text" maxlength="1000" placeholder="Qaror matni (kamida 3 belgi)" data-dr="1" value="${esc(AX.text)}" style="flex:1;min-width:140px"><button class="btn s p" data-da="go"${busy?" disabled":""}>Tasdiqlash</button><button class="btn s" data-da="no">Yo'q</button></div>`;
      else if(d.status==="OPEN")acts=`<div class="acts">${GO("UNDER_REVIEW","Ko'rib chiqish")}${ASK("RESOLVED","Hal qilish")}${ASK("REJECTED","Rad etish","d")}</div>`;
      else if(d.status==="UNDER_REVIEW")acts=`<div class="acts">${ASK("RESOLVED","Hal qilish")}${ASK("REJECTED","Rad etish","d")}</div>`;
      else if(d.status==="RESOLVED"||d.status==="REJECTED")acts=`<div class="acts">${GO("CLOSED","Yopish","")}</div>`}
    return `<div class="row f" style="padding:6px 0"><div><b>${esc(d.publicId)} · ${esc(RS[d.reason]||d.reason)}</b><small>${esc(by)} ochdi · ${esc((d.createdAt||"").slice(0,10))}</small><small style="display:block">${esc(d.description)}</small>${d.resolution?`<small style="display:block">Qaror: ${esc(d.resolution)}</small>`:""}</div><span class="tag ${st[1]}">${esc(st[0])}</span></div>${acts}`};
  const form=()=>!FM.open?`<div class="acts"><button class="btn s p" data-da="new"${busy||!targets.length?" disabled":""}>Nizo ochish</button></div>${targets.length?"":`<p class="hint">Nizo ochish uchun avval buyurtma yoki to'lov bo'lishi kerak.</p>`}`
    :`<h3 style="font-size:16px;margin:8px 0 2px">Yangi nizo</h3><div class="grid"><label>Nima bo'yicha<select data-df="target">${targets.map(x=>`<option value="${esc(x.k)}"${x.k===FM.target?" selected":""}>${esc(x.label)}</option>`).join("")}</select></label><label>Sabab<select data-df="reason">${Object.keys(RS).map(k=>`<option value="${k}"${k===FM.reason?" selected":""}>${esc(RS[k])}</option>`).join("")}</select></label></div><label>Nima bo'ldi? (kamida 5 belgi)<textarea rows="3" maxlength="1000" data-df="desc">${esc(FM.desc)}</textarea></label><div class="acts"><button class="btn s p" data-da="send"${busy?" disabled":""}>Yuborish</button><button class="btn s" data-da="close">Yopish</button></div>`;
  const draw=()=>{const act=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.dr;
    box.innerHTML=`<div class="card"><h2>${adm?"Nizolar (server, admin)":biz?"Nizolarim (server)":"Nizolar (server)"}</h2><p class="hint">Nizo faqat qaror uchun yozuv: pul SutBozor orqali o'tmaydi va to'lov holati o'zgarmaydi.</p>${adm?"":form()}<p class="msg" role="alert">${esc(msg)}</p>${ok?`<p class="hint" style="color:var(--acc)">${esc(ok)}</p>`:""}${list.map(row).join("")||`<p class="hint">Hozircha nizo yo'q.</p>`}<div class="acts"><button class="btn s" data-da="reload"${busy?" disabled":""}>Yangilash</button></div></div>`;
    if(act){const el=box.querySelector("[data-dr]");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}};
  const loadList=()=>api.disputes.list({page:1,limit:50}).then(r=>{list=(r&&r.items)||[]});
  const loadTargets=()=>adm?Promise.resolve():Promise.all([api.payments.list({page:1,limit:100}),api.orders.list({page:1,limit:50}),biz?api.suppliers.list({page:1,limit:100}).catch(()=>({items:[]})):null]).then(a=>{
    const sn={};((a[2]&&a[2].items)||[]).forEach(s=>sn[s.id]=s.name);targets=[];
    ((a[0]&&a[0].items)||[]).forEach(p=>targets.push({k:"p:"+p.id,label:"To'lov "+p.publicId+" · "+money(p.amount)+" so'm",body:{orderId:p.orderId,paymentId:p.id}}));
    ((a[1]&&a[1].items)||[]).forEach(o=>{const seen={};(o.items||[]).forEach(i=>{const sk=biz?i.supplierId:"-";if(seen[sk])return;seen[sk]=1;targets.push({k:"o:"+o.id+(biz?":"+i.supplierId:""),label:"Buyurtma "+o.publicId+" · "+o.product+(biz?" · "+(sn[i.supplierId]||"Supplier"):""),body:biz?{orderId:o.id,supplierId:i.supplierId}:{orderId:o.id}})})});
    if(!targets.some(x=>x.k===FM.target))FM.target=targets.length?targets[0].k:""});
  const load=()=>{busy=true;draw();return call(()=>Promise.all([loadList(),loadTargets()])).then(()=>{busy=false;draw()}).catch(fail)};
  const run=(f,done)=>{busy=true;msg="";ok="";draw();call(f).then(()=>{ok=done;return loadList()}).then(()=>{busy=false;draw()}).catch(e=>{loadList().catch(()=>{}).then(()=>fail(e))})};
  const send=()=>{const t=targets.find(x=>x.k===FM.target),d=FM.desc.trim();
    if(!t){msg="Nima bo'yicha nizo ekanini tanlang.";draw();return}
    if(d.length<5){msg="Nima bo'lganini yozing (kamida 5 belgi).";draw();return}
    run(()=>api.disputes.open(Object.assign({reason:FM.reason,description:d},t.body)),"Nizo yuborildi. Admin ko'rib chiqadi.");
    FM.open=false;FM.desc=""};
  const go=(id,status,text)=>{if((status==="RESOLVED"||status==="REJECTED")&&String(text||"").trim().length<3){msg="Qaror matnini yozing (kamida 3 belgi).";draw();return}
    AX.id="";run(()=>api.disputes.setStatus(id,status,String(text||"").trim()),{UNDER_REVIEW:"Ko'rib chiqilmoqda.",RESOLVED:"Hal qilindi.",REJECTED:"Rad etildi.",CLOSED:"Yopildi."}[status])};
  box.addEventListener("input",e=>{const d=e.target&&e.target.dataset;if(!d)return;if(d.df)FM[d.df]=e.target.value;else if(d.dr)AX.text=e.target.value});
  box.addEventListener("click",e=>{if(busy)return;const b=e.target.closest("[data-da]");if(!b)return;const a=b.dataset.da;
    if(a==="reload")load();else if(a==="new"){FM.open=true;FM.desc="";msg="";ok="";draw()}else if(a==="close"){FM.open=false;draw()}
    else if(a==="send")send();else if(a==="no"){AX.id="";draw()}
    else if(a==="ask"){AX.id=b.dataset.id;AX.status=b.dataset.st;AX.text="";msg="";draw()}
    else if(a==="now")go(b.dataset.id,b.dataset.st,"");
    else if(a==="go")go(AX.id,AX.status,AX.text)});
  load()}
/* Serverga kirgan foydalanuvchi: holat qatori + (supplier bo'lsa) mahsulotlar bo'limi. */
function srvUser(api,el,u){el.textContent="Server: ulandi ("+u.role+")";if(u.role==="admin"&&!$("sord").dataset.on){$("sord").dataset.on="1";$("sord").innerHTML=`<div class="card"><h2>Admin</h2><p class="hint">Siz serverda ADMIN sifatida kirdingiz. Boshqaruv panelida serverdagi nizolar (hal qilish) birinchi bo'lib turadi; qolgan bo'limlar hozircha demo (brauzer xotirasi).</p><div class="acts"><a class="btn p" href="#admin">Admin panelni ochish</a></div></div>`}
  if(u.role==="supplier"&&!$("sprod").dataset.on){$("sprod").dataset.on="1";supProducts(api)}
  if((u.role==="supplier"||u.role==="business")&&!$("sord").dataset.on){$("sord").dataset.on="1";srvOrders(api,u.role)}
  if((u.role==="supplier"||u.role==="business")&&!$("spay").dataset.on){$("spay").dataset.on="1";srvPayments(api,u.role)}
  if((u.role==="supplier"||u.role==="business")&&!$("sdis").dataset.on){$("sdis").dataset.on="1";srvDisputes(api,u.role,$("sdis"))}}
/* Admin: server nizolari faqat server ADMIN rolini tasdiqlagandan keyin (#adis) ko'rinadi. */
function admDis(){const el=$("adis"),api=srvApi(),on=isAdm()&&Auth.ctx==="admin"&&!!api;el.hidden=!on;if(on&&!el.dataset.on){el.dataset.on="1";srvDisputes(api,"admin",el)}}
(function(){try{const el=$("srv"),api=srvApi();if(!el||!api)return;
const tg=window.Telegram&&window.Telegram.WebApp;try{if(tg&&tg.ready)tg.ready()}catch(x){}
el.textContent="Server bilan ulanmoqda…";
api.auth.loginWithTelegram().then(u=>srvUser(api,el,u)).catch(e=>{
  if(e&&e.code==="ACCOUNT_NOT_LINKED"){el.textContent="Server: ro'yxatdan o'tmagansiz";regForm(api,el);return}
  el.textContent="Server: "+(e&&e.code?e.code:"xato")+(e&&e.message?" - "+e.message:"")})}catch(x){}})();
route();
</script>
